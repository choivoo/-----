          package com.seondwaeji.genshinautopilot

          import android.graphics.Bitmap
          import kotlin.math.*

          data class OcrElement(val text:String,val cx:Float,val cy:Float,val w:Float,val h:Float)
          data class SemanticTargets(
              val interactionConfidence:Float=0f,val interactionX:Float?=null,val interactionY:Float?=null,
              val dialogueChoiceConfidence:Float=0f,val dialogueChoiceX:Float?=null,val dialogueChoiceY:Float?=null,
              val questTextConfidence:Float=0f,val questTextX:Float?=null,val questTextY:Float?=null
          )

          object SemanticUiDetector {
              fun detect(elements:List<OcrElement>):SemanticTargets {
                  val usable=elements.filter{it.text.trim().isNotEmpty() && it.text.length<=48}
                  val interaction=usable
                      .filter{it.cx in .53f..84f/100f && it.cy in .27f..78f && it.w<.34f}
                      .maxByOrNull { interactionScore(it) }
                  val rightChoices=usable.filter{it.cx>.56f && it.cy>.36f && it.cy<.84f && it.w<.42f}
                  val choice=if(rightChoices.size>=2) rightChoices.maxByOrNull{it.w} else null
                  val quest=usable
                      .filter{it.cx<.44f && it.cy in .10f..62f && it.w>.06f}
                      .maxByOrNull { questScore(it) }
                  return SemanticTargets(
                      interactionConfidence=interaction?.let{interactionScore(it)}?:0f,
                      interactionX=interaction?.cx,interactionY=interaction?.cy,
                      dialogueChoiceConfidence=choice?.let{(.68f + min(.25f,it.w)).coerceAtMost(.93f)}?:0f,
                      dialogueChoiceX=choice?.cx,dialogueChoiceY=choice?.cy,
                      questTextConfidence=quest?.let{questScore(it)}?:0f,
                      questTextX=quest?.cx,questTextY=quest?.cy
                  )
              }
              private fun interactionScore(e:OcrElement):Float {
                  val center=1f-(abs(e.cy-.52f)/.30f).coerceIn(0f,1f)
                  val xScore=1f-(abs(e.cx-.68f)/.20f).coerceIn(0f,1f)
                  return (.58f+.22f*center+.18f*xScore).coerceIn(0f,.96f)
              }
              private fun questScore(e:OcrElement):Float {
                  val x=1f-(e.cx/.45f).coerceIn(0f,1f)
                  return (.62f+.18f*x+min(.14f,e.w)).coerceIn(0f,.94f)
              }
          }

          data class MarkerObservation(val angle:Float,val confidence:Float)
          data class StableDirection(val angle:Float,val confidence:Float,val stable:Boolean,val oscillating:Boolean)

          class DirectionStabilizer(private val capacity:Int=6) {
              private val q=ArrayDeque<MarkerObservation>()
              private var lastStable:Float?=null
              @Synchronized fun reset(){q.clear();lastStable=null}
              @Synchronized fun offer(obs:MarkerObservation?):StableDirection? {
                  if(obs==null || obs.confidence<.35f) {
                      if(q.isNotEmpty()) q.removeFirst()
                      return summarize()
                  }
                  q.addLast(obs)
                  while(q.size>capacity)q.removeFirst()
                  return summarize()
              }
              private fun summarize():StableDirection? {
                  if(q.isEmpty())return null
                  var sx=0.0;var sy=0.0;var sw=0.0
                  q.forEach{
                      val r=Math.toRadians(it.angle.toDouble())
                      val w=it.confidence.toDouble()
                      sx+=cos(r)*w;sy+=sin(r)*w;sw+=w
                  }
                  if(sw<=0.0)return null
                  val resultant=sqrt(sx*sx+sy*sy)/sw
                  var angle=Math.toDegrees(atan2(sy,sx)).toFloat()
                  val avg=(q.sumOf{it.confidence.toDouble()}/q.size).toFloat()
                  val oscillating=q.size>=4 && resultant<.58
                  var stable=q.size>=3 && resultant>.78 && avg>.58f
                  val prior=lastStable
                  if(stable && prior!=null && angularDistance(prior,angle)>58f && q.size<5) stable=false
                  if(stable){lastStable=angle}
                  else if(prior!=null && !oscillating && resultant>.65) angle=prior
                  return StableDirection(angle,(resultant.toFloat()*avg).coerceIn(0f,1f),stable,oscillating)
              }
              private fun angularDistance(a:Float,b:Float):Float {
                  var d=abs(a-b)%360f
                  if(d>180f)d=360f-d
                  return d
              }
          }

          object NavigationMemory {
              private val stabilizer=DirectionStabilizer(7)
              fun update(obs:MarkerObservation?):StableDirection? = stabilizer.offer(obs)
              fun reset()=stabilizer.reset()
          }

          data class AgentAction(
              val type:AgentActionType,
              val x:Float?=null,val y:Float?=null,
              val confidence:Float=0f,
              val reason:String=""
          )

          data class SteeringDecision(val mode:SteeringMode,val error:Float,val confidence:Float)

          object SteeringController {
              // Minimap top is -90 degrees in screen coordinates.
              private var lastTurn:SteeringMode=SteeringMode.SEARCH
              private var turnSince=0L
              private fun wrap(v:Float):Float {
                  var x=v
                  while(x>180f)x-=360f
                  while(x<-180f)x+=360f
                  return x
              }
              @Synchronized fun decide(markerAngle:Float?,confidence:Float,stable:Boolean,oscillating:Boolean,now:Long=System.currentTimeMillis()):SteeringDecision {
                  if(markerAngle==null || confidence<.60f || !stable) return SteeringDecision(SteeringMode.SEARCH,0f,confidence)
                  if(oscillating) return SteeringDecision(SteeringMode.HOLD,0f,confidence)
                  val error=wrap(markerAngle-(-90f))
                  if(kotlin.math.abs(error)<=16f) {
                      lastTurn=SteeringMode.FORWARD
                      turnSince=now
                      return SteeringDecision(SteeringMode.FORWARD,error,confidence)
                  }
                  val desired=if(error<0f)SteeringMode.TURN_LEFT else SteeringMode.TURN_RIGHT
                  if(lastTurn!=desired) {
                      // hysteresis: don't instantly reverse camera steering.
                      if(now-turnSince<1200L && (lastTurn==SteeringMode.TURN_LEFT || lastTurn==SteeringMode.TURN_RIGHT))
                          return SteeringDecision(SteeringMode.HOLD,error,confidence)
                      lastTurn=desired
                      turnSince=now
                  }
                  return SteeringDecision(desired,error,confidence)
              }
          }

          object ActionArbiter {
              fun choose(s:AccountState,d:Decision):AgentAction {
                  if(s.screen==ScreenType.WISH) return AgentAction(AgentActionType.WAIT,reason="기원 화면 차단")
                  if(s.dialogueChoiceConfidence>.76f && s.dialogueChoiceX!=null && s.dialogueChoiceY!=null)
                      return AgentAction(AgentActionType.DIALOGUE_CHOICE,s.dialogueChoiceX,s.dialogueChoiceY,s.dialogueChoiceConfidence,"대화 선택지")
                  if(s.screen==ScreenType.DIALOGUE) return AgentAction(AgentActionType.DIALOGUE,confidence=.86f,reason="대화 진행")
                  if(s.screen==ScreenType.REWARD) return AgentAction(AgentActionType.REWARD,confidence=.9f,reason="보상 화면")
                  if(s.screen==ScreenType.DEATH) return AgentAction(AgentActionType.REVIVE,confidence=.92f,reason="사망 복구")
                  if(s.screen==ScreenType.BATTLE || s.enemyConfidence>.74f) return AgentAction(AgentActionType.COMBAT,confidence=max(.76f,s.enemyConfidence),reason="전투 감지")
                  if(s.interactionConfidence>.78f && s.interactionX!=null && s.interactionY!=null)
                      return AgentAction(AgentActionType.INTERACT,s.interactionX,s.interactionY,s.interactionConfidence,"상호작용 UI")
                  if(s.stuckFrames>=4) return AgentAction(AgentActionType.RECOVER,confidence=.88f,reason="막힘 감지")
                  val steer=SteeringController.decide(s.miniMapDirection,s.markerConfidence,s.markerStable,s.oscillating)
                  when(steer.mode) {
                      SteeringMode.TURN_LEFT -> return AgentAction(AgentActionType.CAMERA_LEFT,confidence=steer.confidence,reason="카메라 왼쪽 정렬")
                      SteeringMode.TURN_RIGHT -> return AgentAction(AgentActionType.CAMERA_RIGHT,confidence=steer.confidence,reason="카메라 오른쪽 정렬")
                      SteeringMode.FORWARD -> return AgentAction(AgentActionType.MOVE_FORWARD,confidence=steer.confidence,reason="정면 정렬 완료 — 전진")
                      SteeringMode.HOLD -> return AgentAction(AgentActionType.WAIT,reason="방향 진동 감지 — 잠시 유지")
                      SteeringMode.SEARCH -> Unit
                  }
                  if(s.screen==ScreenType.WORLD && s.questTextConfidence>.76f && s.questTextX!=null && s.questTextY!=null)
                      return AgentAction(AgentActionType.RETRACK_QUEST,s.questTextX,s.questTextY,s.questTextConfidence,"퀘스트 텍스트 재추적")
                  return AgentAction(AgentActionType.WAIT,reason=d.reason+" — 확실한 행동 대상 없음")
              }
          }

          object ActionScheduler {
              private val last=mutableMapOf<AgentActionType,Long>()
              private fun cooldown(t:AgentActionType)=when(t){
                  AgentActionType.MOVE_FORWARD->900L
                  AgentActionType.CAMERA_LEFT,AgentActionType.CAMERA_RIGHT->650L
                  AgentActionType.INTERACT->850L
                  AgentActionType.DIALOGUE,AgentActionType.DIALOGUE_CHOICE->520L
                  AgentActionType.RETRACK_QUEST->3500L
                  AgentActionType.RECOVER->2400L
                  AgentActionType.COMBAT->420L
                  else->700L
              }
              @Synchronized fun allow(t:AgentActionType,now:Long):Boolean {
                  val p=last[t]?:0L
                  if(now-p<cooldown(t))return false
                  last[t]=now
                  return true
              }
          }

          object CombatVisualAnalyzer {
              fun enemyConfidence(bitmap:Bitmap):Float {
                  val w=bitmap.width;val h=bitmap.height
                  var best=0
                  for(y in (h*.08).toInt() until (h*.58).toInt() step 4) {
                      var run=0
                      for(x in (w*.18).toInt() until (w*.82).toInt() step 3) {
                          val c=bitmap.getPixel(x,y);val r=(c shr 16)and 255;val g=(c shr 8)and 255;val b=c and 255
                          if(r>155 && r>g*1.55 && r>b*1.45 && g<125){run++;if(run>best)best=run}else run=0
                      }
                  }
                  val normalized=best.toFloat()/max(1,(w*.64/3).toInt())
                  return (normalized*3.8f).coerceIn(0f,.96f)
              }
          }

          object FrameMotionAnalyzer {
              fun sample(bitmap:Bitmap):IntArray {
                  val cols=16;val rows=10;val out=IntArray(cols*rows);var i=0
                  for(ry in 0 until rows)for(rx in 0 until cols){
                      val x=((rx+.5f)/cols*bitmap.width).toInt().coerceIn(0,bitmap.width-1)
                      val y=((ry+.5f)/rows*bitmap.height).toInt().coerceIn(0,bitmap.height-1)
                      val c=bitmap.getPixel(x,y);val r=(c shr 16)and 255;val g=(c shr 8)and 255;val b=c and 255
                      out[i++]=(r*3+g*6+b)/10
                  }
                  return out
              }
              fun difference(a:IntArray?,b:IntArray):Float {
                  if(a==null||a.size!=b.size)return 1f
                  var sum=0f
                  for(i in b.indices)sum+=abs(a[i]-b[i])/255f
                  return (sum/b.size).coerceIn(0f,1f)
              }
          }
