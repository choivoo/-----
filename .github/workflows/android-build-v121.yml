          package com.seondwaeji.genshinautopilot

          import android.graphics.Bitmap
          import kotlin.math.*

          object MiniMapAnalyzer {
              fun questMarker(bitmap:Bitmap):MarkerObservation? {
                  val w=bitmap.width;val h=bitmap.height
                  val roiW=(w*.31f).toInt().coerceAtLeast(40)
                  val roiH=(h*.34f).toInt().coerceAtLeast(40)
                  val step=max(3,min(w,h)/360)
                  val gw=max(1,roiW/step);val gh=max(1,roiH/step)
                  val mask=BooleanArray(gw*gh)
                  fun idx(x:Int,y:Int)=y*gw+x
                  for(gy in 0 until gh)for(gx in 0 until gw){
                      val x=(gx*step).coerceAtMost(w-1);val y=(gy*step).coerceAtMost(h-1)
                      val c=bitmap.getPixel(x,y)
                      val r=(c shr 16)and 255;val g=(c shr 8)and 255;val b=c and 255
                      val yellow=r>178 && g>135 && b<145 && r>g && (r-b)>65 && (g-b)>35
                      mask[idx(gx,gy)]=yellow
                  }
                  val seen=BooleanArray(mask.size)
                  data class Candidate(val cx:Float,val cy:Float,val count:Int,val score:Float)
                  val candidates=mutableListOf<Candidate>()
                  val qx=IntArray(mask.size);val qy=IntArray(mask.size)
                  for(sy in 0 until gh)for(sx in 0 until gw){
                      val si=idx(sx,sy);if(!mask[si]||seen[si])continue
                      var head=0;var tail=0;qx[tail]=sx;qy[tail]=sy;tail++;seen[si]=true
                      var count=0;var sumX=0f;var sumY=0f;var minX=sx;var maxX=sx;var minY=sy;var maxY=sy
                      while(head<tail){
                          val x=qx[head];val y=qy[head];head++;count++;sumX+=x;sumY+=y
                          minX=min(minX,x);maxX=max(maxX,x);minY=min(minY,y);maxY=max(maxY,y)
                          val ns=arrayOf(x+1 to y,x-1 to y,x to y+1,x to y-1)
                          for((nx,ny) in ns)if(nx in 0 until gw && ny in 0 until gh){
                              val ni=idx(nx,ny);if(mask[ni]&&!seen[ni]){seen[ni]=true;qx[tail]=nx;qy[tail]=ny;tail++}
                          }
                      }
                      if(count !in 2..110)continue
                      val cx=sumX/count*step;val cy=sumY/count*step
                      val mapCx=w*.145f;val mapCy=h*.16f
                      val mapR=min(w*.13f,h*.15f)
                      val dist=hypot(cx-mapCx,cy-mapCy)
                      if(dist>mapR*1.45f || dist<mapR*.16f)continue
                      val bw=(maxX-minX+1).toFloat();val bh=(maxY-minY+1).toFloat()
                      val compact=(count/(bw*bh)).coerceIn(0f,1f)
                      val radial=(1f-abs(dist/mapR-.72f)).coerceIn(0f,1f)
                      val size=(1f-abs(count-12f)/45f).coerceIn(0f,1f)
                      val score=(.42f*compact+.38f*radial+.20f*size).coerceIn(0f,.98f)
                      if(score>.36f)candidates+=Candidate(cx,cy,count,score)
                  }
                  val best=candidates.maxByOrNull{it.score}?:return null
                  val mapCx=w*.145f;val mapCy=h*.16f
                  val angle=Math.toDegrees(atan2((best.cy-mapCy).toDouble(),(best.cx-mapCx).toDouble())).toFloat()
                  return MarkerObservation(angle,best.score)
              }
          }
          EOT

