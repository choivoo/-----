          package com.seondwaeji.genshinautopilot

          import android.content.res.Resources

          object AgentController {
              private var lastTick=0L
              fun tick() {
                  val now=System.currentTimeMillis()
                  if(now-lastTick<260)return
                  lastTick=now
                  if(RuntimeState.userPaused){RuntimeState.mode=AgentMode.PAUSED;RuntimeState.lastAction="사용자 일시정지";return}
                  val s=RuntimeState.account
                  val d=GoalPlanner.next(s,RuntimeState.parsedGoal)
                  RuntimeState.mode=d.mode
                  if(d.mode==AgentMode.COMPLETE){RuntimeState.lastAction="목표 완료 — 자동 정지";return}
                  if(!RuntimeState.captureActive){RuntimeState.lastAction="화면 캡처 대기";return}
                  if(!ActionGate.canAct(s,RuntimeState.dryRun)){RuntimeState.lastAction=d.reason+" [관찰 모드]";return}
                  val svc=AutopilotAccessibilityService.instance?:run{RuntimeState.lastAction="접근성 서비스 비활성";return}
                  val action=ActionArbiter.choose(s,d)
                  if(action.type==AgentActionType.WAIT){RuntimeState.lastAction=action.reason;RuntimeState.lastActionType=AgentActionType.WAIT;return}
                  if(!ActionScheduler.allow(action.type,now)){return}
                  val dm=Resources.getSystem().displayMetrics
                  val w=dm.widthPixels.toFloat();val h=dm.heightPixels.toFloat()
                  when(action.type){
                      AgentActionType.DIALOGUE_CHOICE,AgentActionType.INTERACT,AgentActionType.RETRACK_QUEST -> {
                          val x=(action.x?:.72f)*w;val y=(action.y?:.52f)*h
                          svc.tap(x,y)
                      }
                      AgentActionType.DIALOGUE -> svc.tap(w*.84f,h*.84f)
                      AgentActionType.REWARD -> svc.tap(w*.50f,h*.84f)
                      AgentActionType.REVIVE -> svc.tap(w*.50f,h*.68f)
                      AgentActionType.COMBAT -> {
                          when(CombatPolicy.choose(s.hpPercent,s.burstReady,s.skillReady)){
                              CombatAction.DODGE->svc.tap(w*.90f,h*.72f)
                              CombatAction.BURST->svc.tap(w*.83f,h*.78f)
                              CombatAction.SKILL->svc.tap(w*.76f,h*.68f)
                              CombatAction.ATTACK->svc.tap(w*.88f,h*.58f)
                              else->Unit
                          }
                      }
                      AgentActionType.CAMERA_LEFT -> {
                          // Camera steering: swipe world view right so camera rotates left.
                          svc.swipe(w*.58f,h*.46f,w*.70f,h*.46f,320)
                      }
                      AgentActionType.CAMERA_RIGHT -> {
                          // Camera steering: swipe world view left so camera rotates right.
                          svc.swipe(w*.70f,h*.46f,w*.58f,h*.46f,320)
                      }
                      AgentActionType.MOVE_FORWARD -> {
                          // Never steer with the joystick anymore. Forward only.
                          val cx=w*.18f;val cy=h*.78f
                          svc.swipe(cx,cy,cx,cy-h*.115f,680)
                      }
                      AgentActionType.RECOVER -> {
                          NavigationMemory.reset()
                          svc.swipe(w*.72f,h*.48f,w*.58f,h*.48f,360)
                      }
                      else->Unit
                  }
                  RuntimeState.lastActionType=action.type
                  RuntimeState.lastActionAt=now
                  RuntimeState.lastAction=action.type.name+" — "+action.reason+" ("+(action.confidence*100).toInt()+"%)"
              }
          }
          EOT

          cat > app/src/main/java/com/seondwaeji/genshinautopilot/CaptureService.kt <<'EOT'
          package com.seondwaeji.genshinautopilot

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import java.util.concurrent.atomic.AtomicBoolean

          class CaptureService:Service() {
              private val recognizer=TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
              private var reader:ImageReader?=null
              private var lastFrameAt=0L
              private val processing=AtomicBoolean(false)
              private var lastMotion:IntArray?=null
              private var stuckFrames=0
              override fun onBind(intent:Intent?):IBinder?=null

              override fun onCreate(){
                  super.onCreate()
                  getSystemService(NotificationManager::class.java)
                      .createNotificationChannel(NotificationChannel("ga12","Genshin AutoPilot",NotificationManager.IMPORTANCE_LOW))
              }

              override fun onStartCommand(intent:Intent?,flags:Int,startId:Int):Int {
                  startForeground(12,Notification.Builder(this,"ga12")
                      .setContentTitle("Genshin AutoPilot v1.2.1")
                      .setContentText("Temporal Vision Agent 실행 중")
                      .setSmallIcon(android.R.drawable.ic_media_play).build())
                  val code=intent?.getIntExtra("resultCode",Activity.RESULT_CANCELED)?:return START_NOT_STICKY
                  val data=intent.getParcelableExtra<Intent>("data")?:return START_NOT_STICKY
                  val mpm=getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val projection=mpm.getMediaProjection(code,data)
                  RuntimeState.captureActive=true
                  projection.registerCallback(object:MediaProjection.Callback(){
                      override fun onStop(){reader?.close();reader=null;RuntimeState.captureActive=false;RuntimeState.lastAction="화면 캡처 종료"}
                  },Handler(Looper.getMainLooper()))
                  val dm=resources.displayMetrics
                  reader=ImageReader.newInstance(dm.widthPixels,dm.heightPixels,PixelFormat.RGBA_8888,2)
                  projection.createVirtualDisplay("GA12",dm.widthPixels,dm.heightPixels,dm.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,reader!!.surface,null,null)

                  reader!!.setOnImageAvailableListener({r->
                      val now=System.currentTimeMillis()
                      if(now-lastFrameAt<420 || !processing.compareAndSet(false,true)){
                          r.acquireLatestImage()?.close();return@setOnImageAvailableListener
                      }
                      lastFrameAt=now
                      val image=r.acquireLatestImage()
                      if(image==null){processing.set(false);return@setOnImageAvailableListener}
                      try{
                          val p=image.planes[0]
                          val pad=p.rowStride-p.pixelStride*image.width
                          val bmp=Bitmap.createBitmap(image.width+pad/p.pixelStride,image.height,Bitmap.Config.ARGB_8888)
                          bmp.copyPixelsFromBuffer(p.buffer)
                          val cropped=Bitmap.createBitmap(bmp,0,0,image.width,image.height)
                          val markerObs=MiniMapAnalyzer.questMarker(cropped)
                          val stable=NavigationMemory.update(markerObs)
                          val enemy=CombatVisualAnalyzer.enemyConfidence(cropped)
                          val motionSample=FrameMotionAnalyzer.sample(cropped)
                          val motion=FrameMotionAnalyzer.difference(lastMotion,motionSample)
                          if(RuntimeState.lastActionType==AgentActionType.MOVE_FORWARD && motion<.018f) stuckFrames++ else if(motion>.03f) stuckFrames=0
                          lastMotion=motionSample

                          recognizer.process(InputImage.fromBitmap(cropped,0))
                              .addOnSuccessListener{result->
                                  val els=mutableListOf<OcrElement>()
                                  result.textBlocks.forEach{block->block.lines.forEach{line->
                                      val b=line.boundingBox
                                      if(b!=null)els+=OcrElement(
                                          line.text,
                                          ((b.centerX().toFloat()/cropped.width)).coerceIn(0f,1f),
                                          ((b.centerY().toFloat()/cropped.height)).coerceIn(0f,1f),
                                          (b.width().toFloat()/cropped.width).coerceIn(0f,1f),
                                          (b.height().toFloat()/cropped.height).coerceIn(0f,1f)
                                      )
                                  }}
                                  val sem=SemanticUiDetector.detect(els)
                                  var base=ScreenInterpreter.fromText(result.text)
                                  if(sem.dialogueChoiceConfidence>.78f)base=base.copy(screen=ScreenType.DIALOGUE)
                                  else if(enemy>.76f && base.screen==ScreenType.WORLD)base=base.copy(screen=ScreenType.BATTLE)
                                  RuntimeState.account=base.copy(
                                      miniMapDirection=stable?.angle,
                                      markerConfidence=stable?.confidence?:0f,
                                      markerStable=stable?.stable==true,
                                      oscillating=stable?.oscillating==true,
                                      enemyConfidence=enemy,
                                      interactionConfidence=sem.interactionConfidence,
                                      interactionX=sem.interactionX,interactionY=sem.interactionY,
                                      dialogueChoiceConfidence=sem.dialogueChoiceConfidence,
                                      dialogueChoiceX=sem.dialogueChoiceX,dialogueChoiceY=sem.dialogueChoiceY,
                                      questTextConfidence=sem.questTextConfidence,
                                      questTextX=sem.questTextX,questTextY=sem.questTextY,
                                      motionScore=motion,stuckFrames=stuckFrames,
                                      steeringMode=SteeringController.decide(stable?.angle,stable?.confidence?:0f,stable?.stable==true,stable?.oscillating==true).mode,
                                      headingError=stable?.angle?.let{a->
                                          var e=a+90f
                                          while(e>180f)e-=360f
                                          while(e<-180f)e+=360f
                                          e
                                      },
                                      headingLocked=(stable?.stable==true && stable.angle.let{a-> kotlin.math.abs(((a+90f+540f)%360f)-180f)}<16f)
                                  )
                                  AgentController.tick()
                              }
                              .addOnCompleteListener{
                                  processing.set(false)
                                  cropped.recycle();bmp.recycle()
                              }
                      }catch(t:Throwable){
                          processing.set(false)
                      }finally{image.close()}
                  },Handler(Looper.getMainLooper()))
                  return START_STICKY
              }
          }
          EOT

          cat > app/src/main/java/com/seondwaeji/genshinautopilot/MainActivity.kt <<'EOT'
          package com.seondwaeji.genshinautopilot

          import android.content.*
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.media.projection.MediaProjectionManager
          import android.os.Bundle
          import android.provider.Settings
          import android.view.*
          import android.widget.*
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts

          class MainActivity:ComponentActivity() {
              private lateinit var status:TextView
              private lateinit var goalInput:EditText
              private lateinit var analysis:TextView
              private val prefs by lazy{getSharedPreferences("ga11",MODE_PRIVATE)}

              private val captureLauncher=registerForActivityResult(ActivityResultContracts.StartActivityForResult()){r->
                  if(r.resultCode==RESULT_OK && r.data!=null) {
                      startForegroundService(Intent(this,CaptureService::class.java)
                          .putExtra("resultCode",r.resultCode).putExtra("data",r.data))
                      RuntimeState.sessionStarted=System.currentTimeMillis()
                      RuntimeState.captureActive=true
                      RuntimeState.userPaused=false
                      RuntimeState.dryRun=false
                      RuntimeState.mode=AgentMode.AUTOPLAY
                      RuntimeState.pendingAutostart=false
                      RuntimeState.lastAction="AutoPilot 시작 — 첫 화면 분석 대기"
                      toast("AutoPilot 시작됨")
                      refresh()
                      window.decorView.postDelayed({ launchGenshin() },700)
                  } else {
                      RuntimeState.pendingAutostart=false
                      RuntimeState.lastAction="화면 공유 권한이 거부됨"
                      toast("화면 공유 권한이 필요해")
                      refresh()
                  }
              }

              override fun onCreate(savedInstanceState:Bundle?) {
                  super.onCreate(savedInstanceState)
                  val bg=Color.rgb(8,11,22)
                  val panel=Color.rgb(20,24,43)
                  val accent=Color.rgb(140,140,255)
                  val textColor=Color.rgb(238,240,255)

                  val root=LinearLayout(this).apply {
                      orientation=LinearLayout.VERTICAL
                      setPadding(24,28,24,32)
                      setBackgroundColor(bg)
                  }

                  root.addView(ImageView(this).apply {
                      setImageResource(com.seondwaeji.genshinautopilot.R.drawable.autopilot_icon)
                      scaleType=ImageView.ScaleType.CENTER_CROP
                      adjustViewBounds=true
                      layoutParams=LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,dp(190)).apply{bottomMargin=14}
                  })

                  root.addView(TextView(this).apply {
                      setTextColor(textColor);textSize=26f;text="GENSHIN AUTOPILOT  •  v1.2.1"
                      setPadding(4,8,4,8)
                  })
                  root.addView(TextView(this).apply {
                      setTextColor(Color.rgb(170,178,214));textSize=14f
                      text="v1.2.1 Steering Lock: 조이스틱은 전진만, 방향 수정은 카메라로 처리해 좌우 진동을 차단합니다."
                  })

                  goalInput=EditText(this).apply {
                      hint="예: AR18까지 올리고 프롤로그 3막을 깨. 치치를 40레벨 우선 육성. 원석은 쓰지 마."
                      setHintTextColor(Color.rgb(125,132,165));setTextColor(textColor)
                      minLines=3;maxLines=6;setPadding(18,16,18,16)
                      background=rounded(panel,22f)
                      setText(prefs.getString("goal_text",""))
                  }
                  root.addView(goalInput,LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.WRAP_CONTENT).apply{topMargin=16})

                  val row=LinearLayout(this).apply{orientation=LinearLayout.HORIZONTAL}
                  row.addView(button("목표 분석",accent){analyzeGoal()},LinearLayout.LayoutParams(0,dp(52),1f).apply{rightMargin=6})
                  row.addView(button("목표 저장",Color.rgb(61,67,102)){saveGoal()},LinearLayout.LayoutParams(0,dp(52),1f).apply{leftMargin=6})
                  root.addView(row,LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.WRAP_CONTENT).apply{topMargin=10})

                  analysis=TextView(this).apply {
                      setTextColor(textColor);textSize=15f;setPadding(16,16,16,16);background=rounded(panel,18f)
                  }
                  root.addView(analysis,LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.WRAP_CONTENT).apply{topMargin=12})

                  status=TextView(this).apply {
                      setTextColor(Color.rgb(205,211,240));textSize=14f;setPadding(16,16,16,16);background=rounded(panel,18f)
                  }
                  root.addView(status,LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.WRAP_CONTENT).apply{topMargin=12})

                  root.addView(button("▶ AUTOPILOT START",accent){startAutopilot()})
                  root.addView(button("접근성 설정",Color.rgb(51,59,92)){startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))})
                  root.addView(button("화면 스캔만 시작",Color.rgb(51,59,92)){startScanOnly()})
                  root.addView(button("DRY RUN ON / OFF",Color.rgb(51,59,92)){RuntimeState.dryRun=!RuntimeState.dryRun;refresh()})
                  root.addView(button("■ EMERGENCY STOP",Color.rgb(120,46,66)){emergencyStop()})

                  setContentView(ScrollView(this).apply{addView(root)})
                  analyzeGoal()
              }

              override fun onResume() {
                  super.onResume()
                  if(RuntimeState.pendingAutostart && isAccessibilityReady()) {
                      RuntimeState.pendingAutostart=false
                      requestCaptureForAutoplay()
                  }
                  if(::status.isInitialized) refresh()
              }

              private fun isAccessibilityReady():Boolean {
                  if(AutopilotAccessibilityService.instance!=null) return true
                  val enabled=Settings.Secure.getString(contentResolver,Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES).orEmpty()
                  val mine=ComponentName(this,AutopilotAccessibilityService::class.java).flattenToString()
                  return enabled.split(':').any{it.equals(mine,ignoreCase=true)}
              }

              private fun startAutopilot() {
                  analyzeGoal()
                  RuntimeState.userPaused=false
                  RuntimeState.pendingAutostart=true
                  if(!isAccessibilityReady()) {
                      RuntimeState.lastAction="접근성 권한 대기"
                      toast("접근성을 켜고 돌아오면 자동으로 계속할게")
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      refresh()
                      return
                  }
                  requestCaptureForAutoplay()
              }

              private fun requestCaptureForAutoplay() {
                  RuntimeState.pendingAutostart=false
                  RuntimeState.dryRun=false
                  RuntimeState.userPaused=false
                  RuntimeState.lastAction="화면 공유 권한 대기"
                  val mpm=getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  captureLauncher.launch(mpm.createScreenCaptureIntent())
                  refresh()
              }

              private fun startScanOnly() {
                  analyzeGoal()
                  RuntimeState.dryRun=true
                  RuntimeState.userPaused=false
                  val mpm=getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  captureLauncher.launch(mpm.createScreenCaptureIntent())
              }

              private fun emergencyStop() {
                  RuntimeState.userPaused=true
                  RuntimeState.pendingAutostart=false
                  RuntimeState.mode=AgentMode.PAUSED
                  RuntimeState.dryRun=true
                  RuntimeState.captureActive=false
                  stopService(Intent(this,CaptureService::class.java))
                  RuntimeState.lastAction="EMERGENCY STOP — 자동 입력 정지"
                  toast("AutoPilot 정지")
                  refresh()
              }

              private fun launchGenshin() {
                  val intent=packageManager.getLaunchIntentForPackage("com.miHoYo.GenshinImpact")
                  if(intent!=null) {
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(intent)
                  } else {
                      toast("원신 실행은 직접 해줘 — AutoPilot은 계속 대기 중")
                  }
              }

              private fun analyzeGoal() {
                  val raw=goalInput.text?.toString().orEmpty()
                  RuntimeState.currentGoalText=raw
                  RuntimeState.parsedGoal=GoalIntelligence.parse(raw)
                  analysis.text="AI GOAL ANALYSIS\n"+GoalIntelligence.summarize(RuntimeState.parsedGoal)
                  refresh()
              }

              private fun saveGoal() {
                  prefs.edit().putString("goal_text",goalInput.text?.toString().orEmpty()).apply()
                  analyzeGoal()
                  toast("Goal 저장 완료")
              }

              private fun refresh() {
                  val s=RuntimeState.account
                  val d=GoalPlanner.next(s,RuntimeState.parsedGoal)
                  val party=PartyAdvisor.recommend(s,RuntimeState.parsedGoal.priorityCharacter)
                  status.text=
                      "MODE  "+RuntimeState.mode+
                      "\nNEXT  "+d.subGoal+
                      "\nWHY   "+d.reason+
                      "\nAR    "+(s.ar?:"?")+
                      "   PROLOGUE "+s.prologueAct+
                      "\nSNEZHNAYA "+s.snezhnayaPreviewEntered+
                      "   ACT1 "+s.act1Complete+"   ACT2 "+s.act2Complete+
                      "\nSCREEN "+s.screen+"   CONF "+((s.confidence*100).toInt())+"%"+
                      "\nMARKER "+(s.miniMapDirection?:"?")+"°  CONF "+((s.markerConfidence*100).toInt())+"%  STABLE "+s.markerStable+
                      "\nSTEER "+s.steeringMode+"  HEADING ERR "+(s.headingError?:"?")+"  LOCK "+s.headingLocked+
                      "\nOSCILLATING "+s.oscillating+"  MOTION "+String.format("%.3f",s.motionScore)+"  STUCK "+s.stuckFrames+
                      "\nINTERACT "+((s.interactionConfidence*100).toInt())+"%  ENEMY "+((s.enemyConfidence*100).toInt())+"%"+
                      "\nACTION "+RuntimeState.lastActionType+
                      "\nPRIMOGEMS "+(s.primogems?:"?")+"   MORA "+(s.mora?:"?")+"   RESIN "+(s.resin?:"?")+
                      "\nPARTY ADVICE "+party.joinToString(" / ")+
                      "\nCAPTURE "+RuntimeState.captureActive+
                      "   PAUSED "+RuntimeState.userPaused+
                      "\nDRY RUN "+RuntimeState.dryRun+
                      "\nLAST  "+RuntimeState.lastAction+
                      "\n\nWISH / PRIMOGEM SPENDING: LOCKED BY DEFAULT"
              }

              private fun button(label:String,color:Int,action:()->Unit)=Button(this).apply {
                  text=label;isAllCaps=false;setTextColor(Color.WHITE);textSize=15f
                  backgroundTintList=android.content.res.ColorStateList.valueOf(color)
                  setOnClickListener{action()}
                  layoutParams=LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,dp(52)).apply{topMargin=10}
              }
              private fun rounded(color:Int,r:Float)=GradientDrawable().apply{setColor(color);cornerRadius=r}
              private fun dp(v:Int)=(v*resources.displayMetrics.density).toInt()
              private fun toast(s:String)=Toast.makeText(this,s,Toast.LENGTH_SHORT).show()
          }
          EOT

      - name: Unit tests GREEN
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK and icon
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -s app/src/main/res/drawable-nodpi/autopilot_icon.jpg
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/src/main/res/drawable-nodpi/autopilot_icon.jpg

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GenshinAutopilot-v1.2.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
