name: DuoMorph Home 1.0 APK

on:
  push:
    branches:
      - duomorph-home-1.0
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct DuoMorph Home source
        shell: bash
        run: |
          cat duomorph_source.part1.b64 duomorph_source.part2.b64 duomorph_source.part3.b64 duomorph_source.part4.b64 | tr -d '\r\n' | base64 --decode > duomorph-source.zip
          mkdir -p build-src
          unzip -q duomorph-source.zip -d build-src
          test -f build-src/DuoMorphHome_1.0/settings.gradle.kts

      - name: Build debug APK
        working-directory: build-src/DuoMorphHome_1.0
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp build-src/DuoMorphHome_1.0/app/build/outputs/apk/debug/app-debug.apk DuoMorphHome-1.0.0-debug.apk
          sha256sum DuoMorphHome-1.0.0-debug.apk | tee DuoMorphHome-1.0.0-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoMorphHome-1.0.0-debug
          path: |
            DuoMorphHome-1.0.0-debug.apk
            DuoMorphHome-1.0.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
