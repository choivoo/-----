                      "\nDRY RUN "+RuntimeState.dryRun+
                      "\nLAST  "+RuntimeState.lastAction+
                      "\n\nWISH / PRIMOGEM SPENDING: LOCKED BY DEFAULT"
              }

              private fun button(label:String,color:Int,action:()->Unit)=Button(this).apply {
                  text=label;isAllCaps=false;setTextColor(Color.WHITE);textSize=15f
                  backgroundTintList=android.content.res.ColorStateList.valueOf(color)
                  setOnClickListener{action()}
                  layoutParams=LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,dp(52)).apply{topMargin=10}
              }
              private fun rounded(color:Int,r:Float)=GradientDrawable().apply{setColor(color);cornerRadius=r}
              private fun dp(v:Int)=(v*resources.displayMetrics.density).toInt()
              private fun toast(s:String)=Toast.makeText(this,s,Toast.LENGTH_SHORT).show()
          }
