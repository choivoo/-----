          cat > app/src/main/java/com/seondwaeji/genshinautopilot/CaptureService.kt <<'EOT'
          package com.seondwaeji.genshinautopilot

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions

          class CaptureService:Service() {
              private val recognizer=TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
              private var reader:ImageReader?=null
              private var lastFrameAt=0L
              override fun onBind(intent:Intent?):IBinder?=null

              override fun onCreate() {
                  super.onCreate()
                  getSystemService(NotificationManager::class.java)
                      .createNotificationChannel(NotificationChannel("ga11","Genshin AutoPilot",NotificationManager.IMPORTANCE_LOW))
              }

              override fun onStartCommand(intent:Intent?,flags:Int,startId:Int):Int {
                  startForeground(11,Notification.Builder(this,"ga11")
                      .setContentTitle("Genshin AutoPilot v1.1")
                      .setContentText("Goal 분석 / 계정 스캔 / AutoPilot 실행 중")
                      .setSmallIcon(android.R.drawable.ic_media_play).build())

                  val code=intent?.getIntExtra("resultCode",Activity.RESULT_CANCELED)?:return START_NOT_STICKY
                  val data=intent.getParcelableExtra<Intent>("data")?:return START_NOT_STICKY
                  val mpm=getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val projection=mpm.getMediaProjection(code,data)
                  projection.registerCallback(object:MediaProjection.Callback(){override fun onStop(){reader?.close();reader=null}},Handler(Looper.getMainLooper()))
                  val dm=resources.displayMetrics
                  reader=ImageReader.newInstance(dm.widthPixels,dm.heightPixels,PixelFormat.RGBA_8888,2)
                  projection.createVirtualDisplay("GA11",dm.widthPixels,dm.heightPixels,dm.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,reader!!.surface,null,null)

                  reader!!.setOnImageAvailableListener({r->
                      val now=System.currentTimeMillis()
                      if(now-lastFrameAt<800){r.acquireLatestImage()?.close();return@setOnImageAvailableListener}
                      lastFrameAt=now
                      val image=r.acquireLatestImage()?:return@setOnImageAvailableListener
                      try {
                          val p=image.planes[0]
                          val pad=p.rowStride-p.pixelStride*image.width
                          val bmp=Bitmap.createBitmap(image.width+pad/p.pixelStride,image.height,Bitmap.Config.ARGB_8888)
                          bmp.copyPixelsFromBuffer(p.buffer)
                          val cropped=Bitmap.createBitmap(bmp,0,0,image.width,image.height)
                          val dir=MiniMapAnalyzer.questDirection(cropped)
                          recognizer.process(InputImage.fromBitmap(cropped,0)).addOnSuccessListener{result->
                              RuntimeState.account=ScreenInterpreter.fromText(result.text).copy(miniMapDirection=dir)
                              AgentController.tick()
                          }
                      } finally { image.close() }
                  },Handler(Looper.getMainLooper()))
                  return START_STICKY
              }
          }
          EOT

