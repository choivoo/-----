          import android.view.*
          import android.widget.*
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts

          class MainActivity:ComponentActivity() {
              private lateinit var status:TextView
              private lateinit var goalInput:EditText
              private lateinit var analysis:TextView
              private val prefs by lazy{getSharedPreferences("ga11",MODE_PRIVATE)}

              private val captureLauncher=registerForActivityResult(ActivityResultContracts.StartActivityForResult()){r->
                  if(r.resultCode==RESULT_OK && r.data!=null) {
                      startForegroundService(Intent(this,CaptureService::class.java)
                          .putExtra("resultCode",r.resultCode).putExtra("data",r.data))
                      RuntimeState.sessionStarted=System.currentTimeMillis()
                      toast("화면 분석 시작")
                      refresh()
                  }
              }

              override fun onCreate(savedInstanceState:Bundle?) {
                  super.onCreate(savedInstanceState)
