name: Build Genshin Autopilot v0.9

on:
  push:
    branches: [ v0.9 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate base Android project and RED tests
        shell: bash
        run: |
          rm -rf app settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/seondwaeji/genshinautopilot
          mkdir -p app/src/test/java/com/seondwaeji/genshinautopilot
          mkdir -p app/src/main/res/xml app/src/main/res/values

          cat > settings.gradle.kts <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "GenshinAutopilot"
          include(":app")
          EOT

          cat > build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOT

          cat > gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOT

          cat > app/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.seondwaeji.genshinautopilot"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.seondwaeji.genshinautopilot"
                  minSdk = 31
                  targetSdk = 35
                  versionCode = 9
                  versionName = "0.9.0"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("com.google.mlkit:text-recognition:16.0.1")
              testImplementation("junit:junit:4.13.2")
          }
          EOT

          cat > app/src/test/java/com/seondwaeji/genshinautopilot/PlannerTest.kt <<'EOT'
          package com.seondwaeji.genshinautopilot

          import org.junit.Assert.*
          import org.junit.Test

          class PlannerTest {
              @Test fun noGoalMeansScanOnly() {
                  val state = AccountState(ar = 12, prologueAct = 1)
                  assertEquals(AgentMode.SCAN_ONLY, GoalPlanner.next(state, UserGoal.NONE).mode)
              }

              @Test fun goalAr18PrioritizesAdventureRankBeforePrologueFinish() {
                  val state = AccountState(ar = 12, prologueAct = 1)
                  val d = GoalPlanner.next(state, UserGoal.AR18_AND_PROLOGUE_3)
                  assertEquals(AgentMode.AUTOPLAY, d.mode)
                  assertEquals(SubGoal.REACH_AR18, d.subGoal)
              }

              @Test fun afterAr18PlannerFinishesPrologue() {
                  val state = AccountState(ar = 18, prologueAct = 2)
                  assertEquals(SubGoal.COMPLETE_PROLOGUE_3, GoalPlanner.next(state, UserGoal.AR18_AND_PROLOGUE_3).subGoal)
              }

              @Test fun snezhnayaGoalRequiresPrologueFirst() {
                  val state = AccountState(ar = 18, prologueAct = 2)
                  assertEquals(SubGoal.COMPLETE_PROLOGUE_3, GoalPlanner.next(state, UserGoal.SNEZHNAYA_ACT_2).subGoal)
              }

              @Test fun spendingIsAlwaysLockedByDefault() {
                  val p = ResourcePolicy()
                  assertFalse(p.canSpendPrimogems)
                  assertFalse(p.canSpendIntertwinedFates)
                  assertFalse(p.canAutoWish)
              }
          }
          EOT

      - name: Verify RED phase fails before implementation
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest > red.log 2>&1
          code=$?
          cat red.log
          if [ "$code" -eq 0 ]; then
            echo "RED phase unexpectedly passed"
            exit 1
          fi
          echo "RED phase confirmed"

      - name: Generate v0.9 implementation
        shell: bash
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOT'
          <resources>
              <string name="app_name">Genshin Autopilot v0.9</string>
              <string name="accessibility_description">Performs user-enabled gestures for the selected autopilot goal.</string>
          </resources>
          EOT

          cat > app/src/main/res/values/themes.xml <<'EOT'
          <resources>
              <style name="Theme.GenshinAutopilot" parent="android:style/Theme.Material.Light.NoActionBar" />
          </resources>
          EOT

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true" />
          EOT

          cat > app/src/main/AndroidManifest.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application android:allowBackup="true" android:label="@string/app_name" android:theme="@style/Theme.GenshinAutopilot">
                  <activity android:name=".MainActivity" android:screenOrientation="unspecified" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".AutopilotAccessibilityService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="false">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" />
                  </service>
                  <service android:name=".CaptureService" android:foregroundServiceType="mediaProjection" android:exported="false" />
              </application>
          </manifest>
          EOT

          cat > app/src/main/java/com/seondwaeji/genshinautopilot/Model.kt <<'EOT'
          package com.seondwaeji.genshinautopilot

          enum class AgentMode { SCAN_ONLY, AUTOPLAY, PAUSED, COMPLETE }
          enum class UserGoal { NONE, AR18_AND_PROLOGUE_3, SNEZHNAYA_PREVIEW, SNEZHNAYA_ACT_2 }
          enum class SubGoal { SCAN_ACCOUNT, REACH_AR18, COMPLETE_PROLOGUE_3, ENTER_SNEZHNAYA_PREVIEW, COMPLETE_ACT_1, COMPLETE_ACT_2, DONE }
          enum class ScreenType { WORLD, DIALOGUE, QUEST, MAP, PARTY, CHARACTER, BATTLE, LOADING, REWARD, UNKNOWN }

          data class AccountState(
              val ar: Int? = null,
              val prologueAct: Int = 0,
              val snezhnayaPreviewEntered: Boolean = false,
              val act1Complete: Boolean = false,
              val act2Complete: Boolean = false,
              val screen: ScreenType = ScreenType.UNKNOWN,
              val currentQuestText: String = "",
              val confidence: Float = 0f,
              val lastOcrText: String = ""
          )

          data class Decision(val mode: AgentMode, val subGoal: SubGoal, val reason: String)

          class ResourcePolicy {
              val canSpendPrimogems = false
              val canSpendIntertwinedFates = false
              val canAutoWish = false
          }

          object RuntimeState {
              @Volatile var account = AccountState()
              @Volatile var goal = UserGoal.NONE
              @Volatile var mode = AgentMode.SCAN_ONLY
              @Volatile var dryRun = true
              @Volatile var lastAction = "Idle"
          }
          EOT

          cat > app/src/main/java/com/seondwaeji/genshinautopilot/GoalPlanner.kt <<'EOT'
          package com.seondwaeji.genshinautopilot

          object GoalPlanner {
              fun next(s: AccountState, goal: UserGoal): Decision {
                  if (goal == UserGoal.NONE) return Decision(AgentMode.SCAN_ONLY, SubGoal.SCAN_ACCOUNT, "No user goal selected")
                  val ar = s.ar ?: return Decision(AgentMode.SCAN_ONLY, SubGoal.SCAN_ACCOUNT, "AR not known yet")
                  if (ar < 18) return Decision(AgentMode.AUTOPLAY, SubGoal.REACH_AR18, "Need AR18")
                  if (s.prologueAct < 3) return Decision(AgentMode.AUTOPLAY, SubGoal.COMPLETE_PROLOGUE_3, "Finish Mondstadt prologue")
                  if (goal == UserGoal.AR18_AND_PROLOGUE_3) return Decision(AgentMode.COMPLETE, SubGoal.DONE, "Goal reached")
                  if (!s.snezhnayaPreviewEntered) return Decision(AgentMode.AUTOPLAY, SubGoal.ENTER_SNEZHNAYA_PREVIEW, "Enter Snezhnaya preview")
                  if (goal == UserGoal.SNEZHNAYA_PREVIEW) return Decision(AgentMode.COMPLETE, SubGoal.DONE, "Goal reached")
                  if (!s.act1Complete) return Decision(AgentMode.AUTOPLAY, SubGoal.COMPLETE_ACT_1, "Complete Chapter 7 Act 1")
                  if (!s.act2Complete) return Decision(AgentMode.AUTOPLAY, SubGoal.COMPLETE_ACT_2, "Complete Chapter 7 Act 2")
                  return Decision(AgentMode.COMPLETE, SubGoal.DONE, "Goal reached")
              }
          }
          EOT

          cat > app/src/main/java/com/seondwaeji/genshinautopilot/ScreenInterpreter.kt <<'EOT'
          package com.seondwaeji.genshinautopilot

          object ScreenInterpreter {
              fun fromText(raw: String): AccountState {
                  val t = raw.replace("\n", " ")
                  val ar = Regex("(?:AR|모험 등급|Adventure Rank)\\s*[: ]?\\s*(\\d{1,2})", RegexOption.IGNORE_CASE)
                      .find(t)?.groupValues?.getOrNull(1)?.toIntOrNull()
                  val screen = when {
                      t.contains("대화", true) || t.contains("Dialogue", true) -> ScreenType.DIALOGUE
                      t.contains("임무", true) || t.contains("Quest", true) -> ScreenType.QUEST
                      t.contains("파티", true) || t.contains("Party", true) -> ScreenType.PARTY
                      t.contains("캐릭터", true) || t.contains("Character", true) -> ScreenType.CHARACTER
                      t.contains("지도", true) || t.contains("Map", true) -> ScreenType.MAP
                      else -> ScreenType.WORLD
                  }
                  val p = when {
                      t.contains("드래곤과 자유의 노래", true) || t.contains("Song of the Dragon", true) -> 3
                      t.contains("프롤로그 제2막", true) || t.contains("Prologue Act II", true) -> 2
                      t.contains("프롤로그 제1막", true) || t.contains("Prologue Act I", true) -> 1
                      else -> RuntimeState.account.prologueAct
                  }
                  val preview = t.contains("스네즈나야", true) || t.contains("Snezhnaya", true) || RuntimeState.account.snezhnayaPreviewEntered
                  val a1 = t.contains("7장 2막", true) || t.contains("Act II", true) || RuntimeState.account.act1Complete
                  val a2 = t.contains("7장 2막 완료", true) || t.contains("Act II Complete", true) || RuntimeState.account.act2Complete
                  return RuntimeState.account.copy(ar = ar ?: RuntimeState.account.ar, prologueAct = p, snezhnayaPreviewEntered = preview, act1Complete = a1, act2Complete = a2, screen = screen, confidence = if (t.isBlank()) 0.2f else 0.75f, lastOcrText = t.take(2000))
              }
          }
          EOT

          cat > app/src/main/java/com/seondwaeji/genshinautopilot/AutopilotAccessibilityService.kt <<'EOT'
          package com.seondwaeji.genshinautopilot

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent

          class AutopilotAccessibilityService : AccessibilityService() {
              companion object { @Volatile var instance: AutopilotAccessibilityService? = null }
              override fun onServiceConnected() { instance = this }
              override fun onDestroy() { if (instance === this) instance = null; super.onDestroy() }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) = Unit
              override fun onInterrupt() = Unit
              fun tap(x: Float, y: Float): Boolean {
                  val path = Path().apply { moveTo(x, y) }
                  val g = GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(path, 0, 70)).build()
                  return dispatchGesture(g, null, null)
              }
              fun swipe(x1: Float, y1: Float, x2: Float, y2: Float, ms: Long = 450): Boolean {
                  val p = Path().apply { moveTo(x1,y1); lineTo(x2,y2) }
                  val g = GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p,0,ms)).build()
                  return dispatchGesture(g,null,null)
              }
          }
          EOT

          cat > app/src/main/java/com/seondwaeji/genshinautopilot/AgentController.kt <<'EOT'
          package com.seondwaeji.genshinautopilot

          import android.content.res.Resources

          object AgentController {
              fun tick() {
                  val d = GoalPlanner.next(RuntimeState.account, RuntimeState.goal)
                  RuntimeState.mode = d.mode
                  if (d.mode != AgentMode.AUTOPLAY || RuntimeState.dryRun) {
                      RuntimeState.lastAction = "${d.subGoal}: ${d.reason}"
                      return
                  }
                  val svc = AutopilotAccessibilityService.instance ?: run {
                      RuntimeState.lastAction = "Accessibility service not enabled"
                      return
                  }
                  if (RuntimeState.account.confidence < 0.70f) {
                      RuntimeState.lastAction = "Low confidence: rescan"
                      return
                  }
                  val dm = Resources.getSystem().displayMetrics
                  val w = dm.widthPixels.toFloat(); val h = dm.heightPixels.toFloat()
                  RuntimeState.lastAction = when (d.subGoal) {
                      SubGoal.REACH_AR18, SubGoal.COMPLETE_PROLOGUE_3, SubGoal.COMPLETE_ACT_1, SubGoal.COMPLETE_ACT_2 -> {
                          svc.tap(w * 0.86f, h * 0.50f); "Advance current quest / dialogue"
                      }
                      SubGoal.ENTER_SNEZHNAYA_PREVIEW -> {
                          svc.tap(w * 0.08f, h * 0.08f); "Open navigation/quest UI for Snezhnaya preview"
                      }
                      else -> "Scanning"
                  }
              }
          }
          EOT

          cat > app/src/main/java/com/seondwaeji/genshinautopilot/CaptureService.kt <<'EOT'
          package com.seondwaeji.genshinautopilot

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.media.ImageReader
          import android.media.projection.MediaProjectionManager
          import android.os.IBinder
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions

          class CaptureService : Service() {
              private val recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
              private var reader: ImageReader? = null
              override fun onBind(intent: Intent?): IBinder? = null
              override fun onCreate() { super.onCreate(); createChannel() }
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startForeground(9, Notification.Builder(this,"ga09").setContentTitle("Genshin Autopilot v0.9").setContentText("Screen analysis active").setSmallIcon(android.R.drawable.ic_menu_view).build())
                  val code = intent?.getIntExtra("resultCode", Activity.RESULT_CANCELED) ?: return START_NOT_STICKY
                  val data = intent.getParcelableExtra<Intent>("data") ?: return START_NOT_STICKY
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val projection = mpm.getMediaProjection(code, data)
                  val dm = resources.displayMetrics
                  reader = ImageReader.newInstance(dm.widthPixels, dm.heightPixels, PixelFormat.RGBA_8888, 2)
                  projection.createVirtualDisplay("GA09", dm.widthPixels, dm.heightPixels, dm.densityDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader!!.surface, null, null)
                  reader!!.setOnImageAvailableListener({ r ->
                      val image = r.acquireLatestImage() ?: return@setOnImageAvailableListener
                      try {
                          val p = image.planes[0]; val buf = p.buffer
                          val rowPadding = p.rowStride - p.pixelStride * image.width
                          val bmp = Bitmap.createBitmap(image.width + rowPadding / p.pixelStride, image.height, Bitmap.Config.ARGB_8888)
                          bmp.copyPixelsFromBuffer(buf)
                          val cropped = Bitmap.createBitmap(bmp,0,0,image.width,image.height)
                          recognizer.process(InputImage.fromBitmap(cropped,0)).addOnSuccessListener { result ->
                              RuntimeState.account = ScreenInterpreter.fromText(result.text)
                              AgentController.tick()
                          }
                      } finally { image.close() }
                  }, null)
                  return START_STICKY
              }
              private fun createChannel() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("ga09","Autopilot",NotificationManager.IMPORTANCE_LOW))
              }
          }
          EOT

          cat > app/src/main/java/com/seondwaeji/genshinautopilot/MainActivity.kt <<'EOT'
          package com.seondwaeji.genshinautopilot

          import android.app.*
          import android.content.*
          import android.graphics.Color
          import android.media.projection.MediaProjectionManager
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.*

          class MainActivity : Activity() {
              private lateinit var status: TextView
              private val captureLauncher = registerForActivityResult(androidx.activity.result.contract.ActivityResultContracts.StartActivityForResult()) { r ->
                  if (r.resultCode == RESULT_OK && r.data != null) {
                      val i = Intent(this, CaptureService::class.java).putExtra("resultCode", r.resultCode).putExtra("data", r.data)
                      startForegroundService(i)
                      toast("Screen analysis started")
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(32,40,32,32); setBackgroundColor(Color.rgb(245,247,252)); gravity = Gravity.CENTER_HORIZONTAL }
                  root.addView(TextView(this).apply { text="GENSHIN AUTOPILOT v0.9"; textSize=24f; setTextColor(Color.BLACK) })
                  status = TextView(this).apply { textSize=16f; setPadding(0,24,0,24) }; root.addView(status)
                  root.addView(btn("1. ENABLE ACCESSIBILITY") { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) })
                  root.addView(btn("2. START ACCOUNT SCAN") {
                      RuntimeState.goal = UserGoal.NONE; RuntimeState.mode = AgentMode.SCAN_ONLY
                      val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      captureLauncher.launch(mpm.createScreenCaptureIntent()); refresh()
                  })
                  root.addView(goalBtn("GOAL: AR18 + PROLOGUE 3") { UserGoal.AR18_AND_PROLOGUE_3 })
                  root.addView(goalBtn("GOAL: SNEZHNAYA PREVIEW") { UserGoal.SNEZHNAYA_PREVIEW })
                  root.addView(goalBtn("GOAL: SNEZHNAYA ACT 2") { UserGoal.SNEZHNAYA_ACT_2 })
                  root.addView(btn("DRY RUN ON/OFF") { RuntimeState.dryRun = !RuntimeState.dryRun; refresh() })
                  root.addView(btn("START / TICK AUTOPILOT") { AgentController.tick(); refresh() })
                  root.addView(btn("PAUSE + CLEAR GOAL") { RuntimeState.goal = UserGoal.NONE; RuntimeState.mode = AgentMode.PAUSED; RuntimeState.dryRun = true; refresh() })
                  setContentView(root); refresh()
                  status.setOnClickListener { refresh() }
              }

              private fun goalBtn(label:String, goal:()->UserGoal) = btn(label) { RuntimeState.goal = goal(); RuntimeState.dryRun = true; AgentController.tick(); refresh(); toast("Goal selected. Dry run remains ON until you turn it off.") }
              private fun btn(label:String, a:()->Unit)=Button(this).apply { text=label; isAllCaps=false; setOnClickListener{a()}; layoutParams=LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.WRAP_CONTENT).apply{setMargins(0,7,0,7)} }
              private fun refresh() { val a=RuntimeState.account; val d=GoalPlanner.next(a,RuntimeState.goal); status.text="Mode: ${RuntimeState.mode}\nGoal: ${RuntimeState.goal}\nNext: ${d.subGoal}\nAR: ${a.ar ?: "?"}\nPrologue act: ${a.prologueAct}\nSnezhnaya preview: ${a.snezhnayaPreviewEntered}\nAct1: ${a.act1Complete} / Act2: ${a.act2Complete}\nScreen: ${a.screen}\nConfidence: ${(a.confidence*100).toInt()}%\nDry run: ${RuntimeState.dryRun}\nLast action: ${RuntimeState.lastAction}\n\nPrimogems / Intertwined Fates / Auto Wish: LOCKED" }
              private fun toast(s:String)=Toast.makeText(this,s,Toast.LENGTH_SHORT).show()
          }
          EOT

          # MainActivity uses AndroidX Activity Result API.
          python3 - <<'PY'
          p='app/build.gradle.kts'
          s=open(p).read().replace('implementation("androidx.core:core-ktx:1.15.0")','implementation("androidx.core:core-ktx:1.15.0")\n              implementation("androidx.activity:activity-ktx:1.10.0")')
          open(p,'w').write(s)
          PY

      - name: Run unit tests GREEN
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenshinAutopilot-v0.9-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
